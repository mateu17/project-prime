nt-size:12px;letter-spacing:1px} .actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}.done{text-decoration:line-through;color:var(--muted)}svg{width:100%;height:auto} .notice{border-left:3px solid var(--green);padding-left:12px} .empty{color:var(--muted);padding:8px 0} 
:root{color-scheme:dark;--bg:#0B0E17;--panel:#161C2B;--green:#89A2FF;--muted:#9DA8C4;--border:#2A3347;--field:#101625;--ink:#F5F7FF;--violet:#A78BFA;--aqua:#38D9C5;--hero:#1A2546}html[data-theme=light]{color-scheme:light;--bg:#F1F4FA;--panel:#FFFFFF;--green:#365DD0;--muted:#53617A;--border:#DCE3EF;--field:#F5F7FC;--ink:#162039;--violet:#7252BD;--aqua:#087F75;--hero:#E2E9FF}body{background:var(--bg);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-.15px}main{padding: max(22px,env(safe-area-inset-top)) 18px calc(115px + env(safe-area-inset-bottom));}header{padding:6px 0 12px}h1{font-size:32px;font-weight:850;letter-spacing:-2px}h2{font-size:32px;letter-spacing:-1.3px;line-height:1.1;margin:20px 0 10px}h3{font-size:17px;letter-spacing:-.4px;font-weight:700}h2 small{font-size:11px;letter-spacing:0;font-weight:500} .card{background:var(--panel);border:1px solid var(--border);border-radius:24px;padding:18px;margin:14px 0;box-shadow:0 8px 24px #00000009}.big{color:var(--ink);font-size:26px;letter-spacing:-1px}.grid{gap:10px}.grid .card{padding:15px}.grid .card small{font-weight:600}button,input,select,textarea{background:var(--field);color:var(--ink);border:1px solid var(--border);border-radius:13px;padding:12px;min-height:44px}input,select,textarea{font-size:16px}button{font-weight:600;transition:transform .15s,background .15s}button:active{transform:scale(.97)}button.primary{background:linear-gradient(115deg,#4264DC,#7553C8);color:white;box-shadow:0 5px 15px #547BFF22}button.secondary{background:var(--hero)}button:disabled{opacity:.45;cursor:default}input[type=checkbox]{min-height:22px;accent-color:var(--green)}.line{border-color:var(--border);padding:13px 0}.bar{background:var(--border);height:7px}.bar i{background:linear-gradient(90deg,#547BFF,#A78BFA);transition:width .35s}.notice{border-color:var(--violet)}nav{left:50%;right:auto;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(94%,6 </style></head><body><main><header><h1>prime<span style="color:var(--green)">.</span></h1><div class="header-actions"><button onclick="cycleTheme()" id="themeButton" aria-label="Cambiar tema" title="Cambiar tema">◐</button><button onclick="backup()" aria-label="Exportar datos" title="Exportar datos">↧</button></div></header><div id="app"></div></main><nav id="nav"></nav><script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const day=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}; const initial=()=>({days:{},sets:[],tasks:[],money:[],goal:90,profile:{work:'07:00–16:00',sport:'20:30–22:30',steps:7000,sleep:8},habits:[],targets:[],short:false,plan:[],routineDay:'',routineAccepted:false});let S;try{S=JSON.parse(localStorage.getItem('prime-v1'))||initial()}catch{S=initial()}let tab=0;const groups=['Pecho','Espalda','Piernas','Hombros','Bíceps','Tríceps','Core'];const exercises={'Pecho':['Press banca','Press mancuernas'],'Espalda':['Remo','Jalón al pecho'],'Piernas':['Sentadilla con mancuerna','Extensión de cuádriceps','Peso muerto rumano'],'Hombros':['Press militar','Elevaciones laterales'],'Bíceps':['Curl mancuernas'],'Tríceps':['Extensión tríceps'],'Core':['Plancha','Dead bug']};function today(){return S.days[day()]??=( {weight:'',sleep:'',steps:'',water:0,creatine:false,meals:[],energy:3,workout:false,review:false,short:false})}function save(){try{localStorage.setItem('prime-v1',JSON.stringify(S))}catch(e){alert('No se han podido guardar los datos. Exporta una copia.')}}function go(n){tab=n;render()}function change(k,v){today()[k]=v;save();render()}function val(id){return $(id).value}function num(id){return Number(val(id))}function recent(n){let x=new Date();x.setDate(x.getDate()-n+1);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`}function volume(n=7){let o=Object.fromEntries(groups.map(g=>[g,0]));S.sets.filter(x=>x.date>=recent(n)).forEach(x=>o[x.group]=(o[x.group]||0)+x.sets);return o}function sport(){return [1,3,4].includes(new Date().getDay())}function gym(){return [2,5].includes(new Date().getDay())}function missions(d){return [['Registrar peso',!!d.weight],['Registrar descanso',!!d.sleep],['Registrar una comida',d.meals.length>0],['Tomar creatina (si corresponde)',d.creatine],['Completar una tarea personal',S.tasks.some(t=>t.doneDate===day())],[(sport()||gym())?'Registrar entrenamiento':'Registrar recuperación',d.workout||d.review]]}function points(){return Object.entries(S.days).reduce((a,[date,d])=>a+10*[!!d.weight,!!d.sleep,d.meals.length>0,d.creatine,S.tasks.some(t=>t.doneDate===date),d.workout||d.review].filter(Boolean).length,0)}function planText(){return sport()?'Fútbol sala · 20:30–22:30':gym()?'Gimnasio · sesión de fuerza':'Recuperación o descanso activo'}function card(t,b){return `<section class="card"><h3>${t}</h3>${b}</section>`}function field(label,id,type,value,extra=''){return `<label>${label}<input id="${id}" type="${type}" value="${esc(value)}" ${extra}></label>`}function chart(){let a=Object.entries(S.days).filter(([k,d])=>Number(d.weight)>0).sort().slice(-30);if(!a.length)return '<p class="empty">Registra tu primer peso para ver la evolución.</p>';let w=a.map(x=>+x[1].weight),min=Math.min(...w)-1,max=Math.max(...w)+1;let pts=w.map((v,i)=>`${20+i*280/Math.max(1,w.length-1)},${100-(v-min)/(max-min)*80}`).join(' ');return `<svg viewBox="0 0 320 120" role="img" aria-label="Evolución de peso"><polyline points="${pts}" stroke="var(--green)" stroke-width="3" fill="none"/>${w.map((v,i)=>`<circle cx="${20+i*280/Math.max(1,w.length-1)}" cy="${100-(v-min)/(max-min)*80}" r="3" fill="var(--green)"/>`).join('')}<text x="20" y="115" fill="var(--muted)" font-size="10">${a[0][0]}</text><text x="300" y="115" text-anchor="end" fill="var(--muted)" font-size="10">${a.at(-1)[0]}</text></svg><small>Último: ${w.at(-1)} kg · Cambio registrado: ${(w.at(-1)-w[0]).toFixed(1)} kg</small>`}function home(){let d=today(),m=missions(d),n=m.filter(x=>x[1]).length,p=points();return `<h2>Tu día</h2><div class="muted">${new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})}</div>${card('NIVEL '+(Math.floor(p/200)+1),`<div class="big">${p} XP</div><div class="bar"><i style="width:${p%200/2}%"></i></div><small>${200-p%200} XP para el siguiente nivel</small>`)}<div class="grid">${[['Peso',d.weight?d.weight+' kg':'—'],['Sueño',d.sleep?d.sleep+' h':'—'],['Pasos',d.steps||'—'],['Misiones',n+'/'+m.length]].map(([k,v])=>`<div class="card"><small>${k}</small><div class="big">${v}</div></div>`).join('')}</div>${card('Planning de hoy',`<p>${planText()}</p><button class="secondary" onclick="change('short',!today().short)">${d.short?'Restaurar día normal':'Hoy voy justo de tiempo'}</button>${d.short?'<p class="notice">Prioriza registrar tus datos, una tarea esencial y descansar o realizar una sesión breve si procede.</p>':''}`)}${card('Misiones realistas',m.map(([t,b])=>`<div class="line"><span class="${b?'done':''}">${t}</span><strong>${b?'✓':'○'}</strong></div>`).join('')+`<div class="bar"><i style="width:${n/m.length*100}%"></i></div><div class="actions"><button onclick="go(2)">Registrar salud</button><button onclick="go(3)">Mis tareas</button></div>`)}${card('Evolución física',chart())}`}
function propose(){let d=today(),v=volume(7),v14=volume(14),rank=[...groups].sort((a,b)=>(v[a]*2+v14[a])-(v[b]*2+v14[b]));let tired=(d.sleep!==''&&+d.sleep<6)||+d.energy<=2;let allowed=rank.filter(g=>!(sport()&&g==='Piernas'));let count=tired||d.short?2:3;S.plan=allowed.slice(0,count).map(g=>({group:g,name:exercises[g][0],sets:tired?2:3,reps:g==='Core'?30:10}));S.routineDay=day();S.routineAccepted=false;save();render()}function logSet(){let g=val('group'),name=val('exercise').trim(),sets=num('sets'),reps=num('reps'),kg=num('kg');if(!name||!Number.isInteger(sets)||sets<1||!Number.isInteger(reps)||reps<1||kg<0||!Number.isFinite(kg))return alert('Revisa los datos del ejercicio.');S.sets.push({date:day(),group:g,name,sets,reps,kg});today().workout=true;save();render()}function usePlan(i){let x=S.plan[i];$('group').value=x.group;$('exercise').value=x.name;$('sets').value=x.sets;$('reps').value=x.reps;$('kg').value=0;let last=S.sets.filter(y=>y.name===x.name).at(-1);if(last)$('kg').value=last.kg;$('exercise').scrollIntoView({block:'center'})}function training(){let v=volume(),d=today();return `<h2>Entrenamiento</h2>${card('Hoy · '+planText(),`<p class="muted">Equilibrio muscular, carga y recuperación. Las propuestas no sustituyen una planificación profesional.</p><div class="actions"><button class="primary" onclick="propose()">Generar rutina adaptada</button><button onclick="change('workout',true)">Registrar fútbol / sesión</button></div>${S.routineDay===day()?`<p class="notice">Prioridad a los músculos con menos series registradas en 7 y 14 días. ${sport()?'Se evita añadir pierna antes del fútbol sala.':''} ${(d.sleep!==''&&+d.sleep<6)||+d.energy<=2?'Volumen reducido por recuperación.':''}</p>${!S.plan.length?'<p>Hoy se recomienda recuperación, sin rutina adicional.</p>':''}${S.plan.map((x,i)=>`<div class="line"><span>${x.name}<br><small>${x.group} · ${x.sets} × ${x.reps}${x.name==='Plancha'?' s':''}</small></span>${S.routineAccepted?`<button onclick="usePlan(${i})">Registrar</button>`:''}</div>`).join('')}<button class="primary" ${!S.plan.length?'disabled':''} onclick="S.routineAccepted=true;save();render()">${S.routineAccepted?'Rutina aceptada ✓':'Aceptar propuesta'}</button>`:''}`)}${card('Equilibrio muscular · 7 días',groups.map(g=>`<div class="line"><span>${g}<div class="bar"><i style="width:${Math.min(100,v[g]/10*100)}%"></i></div></span><small>${v[g]} series</small></div>`).join('')+'<small>La barra usa 10 series como referencia visual, no como obligación.</small>')}${card('Registrar ejercicio',`<label>Grupo muscular<select id="group" onchange="$('exercise').value=exercises[this.value][0]">${groups.map(g=>`<option>${g}</option>`).join('')}</select></label>${field('Ejercicio','exercise','text','Press banca')}<div class="grid">${field('Series','sets','number',3,'min="1"')}${field('Repeticiones / segundos (plancha)','reps','number',10,'min="1"')}${field('Carga (kg)','kg','number',0,'min="0" step="0.25"')}</div><button class="primary" onclick="logSet()">Guardar ejercicio</button><button onclick="suggestLoad()">Consultar última carga</button><p id="loadTip" class="muted"></p>`)}${card('Historial',S.sets.slice().reverse().slice(0,30).map(x=>`<div class="line"><span>${esc(x.name)}<br><small>${x.date} · ${x.sets} × ${x.reps} · ${x.kg} kg</small></span></div>`).join('')||'<p class="empty">Todavía no hay ejercicios registrados.</p>')}`}
function suggestLoad(){let name=val('exercise').trim(),a=S.sets.filter(x=>x.name.toLowerCase()===name.toLowerCase()),l=a.at(-1);$('loadTip').textContent=l?`Última sesión: ${l.kg} kg, ${l.sets} × ${l.reps}. Mantén la carga o aumenta el mínimo disponible solo si completaste las repeticiones con técnica y margen de 2–3 repeticiones.`:'No hay registros anteriores. Empieza con una carga cómoda y buena técnica.'}
function health(){let d=today();return `<h2>Salud y nutrición</h2>${card('Registro diario',`${field('Peso (kg)','weight','number',d.weight,'min="1" step="0.1"')}${field('Sueño (horas)','sleep','number',d.sleep,'min="0" max="24" step="0.25"')}${field('Pasos','steps','number',d.steps,'min="0"')}<label>Energía (1 = muy baja, 5 = alta)<select id="energy">${[1,2,3,4,5].map(n=>`<option ${d.energy==n?'selected':''}>${n}</option>`).join('')}</select></label><button class="primary" onclick="saveHealth()">Guardar datos</button>`)}${card('Hábitos',`<div class="line"><span>Agua · ${d.water} vasos</span><button onclick="change('water',Math.max(0,today().water-1))">−</button><button onclick="change('water',today().water+1)">+</button></div><div class="line"><span>Creatina</span><input type="checkbox" ${d.creatine?'checked':''} onchange="change('creatine',this.checked)"></div><div class="line"><span>Descanso / recuperación</span><input type="checkbox" ${d.review?'checked':''} onchange="change('review',this.checked)"></div>`)}${card('Alimentación sin báscula',`<label>¿Qué has comido?<textarea id="meal" placeholder="Ej. arroz con pollo, un plato mediano"></textarea></label><button class="primary" onclick="addMeal()">Registrar comida</button>${d.meals.map((m,i)=>`<div class="line"><span>${esc(m)}</span><button onclick="today().meals.splice(${i},1);save();render()">×</button></div>`).join('')}`)}${card('Ideas de menú',`<p>Comida: lentejas, arroz con pollo o pasta con atún.</p><p>Cena: filete con patata cocida, fajitas de pollo o tortilla con jamón.</p><small>Ajusta cantidades a hambre, actividad y recuperación.</small>`)}${card('Peso y objetivo',chart()+field('Objetivo personal (kg)','goal','number',S.goal,'min="1" step="0.1"')+'<button onclick="if(num(\'goal\')>0){S.goal=num(\'goal\');save();render()}">Guardar objetivo</button>')}`}
function saveHealth(){let w=val('weight'),sl=val('sleep'),st=val('steps');if((w&&+w<=0)||(sl&&(+sl<0||+sl>24))||(st&&+st<0))return alert('Revisa los valores.');Object.assign(today(),{weight:w,sleep:sl,steps:st,energy:num('energy')});save();render()}function addMeal(){let m=val('meal').trim();if(m){today().meals.push(m);save();render()}}
function life(){let month=day().slice(0,7),a=S.money.filter(x=>x.date.startsWith(month)),inc=a.filter(x=>x.type==='Ingreso').reduce((s,x)=>s+x.amount,0),out=a.filter(x=>x.type==='Gasto').reduce((s,x)=>s+x.amount,0);return `<h2>Mi vida</h2>${card('Tareas y objetivos',`<input id="task" placeholder="Ej. Preparar bolsa del gimnasio"><label>Fecha<input id="due" type="date" value="${day()}"></label><button class="primary" onclick="addTask()">Añadir tarea</button>${S.tasks.map((t,i)=>`<div class="line"><input type="checkbox" ${t.doneDate?'checked':''} onchange="S.tasks[${i}].doneDate=this.checked?day():null;save();render()"><span class="${t.doneDate?'done':''}">${esc(t.title)}<br><small>${esc(t.due)}</small></span><button onclick="S.tasks.splice(${i},1);save();render()">×</button></div>`).join('')}`)}${card('Economía básica · este mes',`<div class="grid"><div><small>Ingresos</small><div class="big">${inc.toFixed(2)} €</div></div><div><small>Gastos</small><div class="big">${out.toFixed(2)} €</div></div></div><p>Balance registrado: <strong>${(inc-out).toFixed(2)} €</strong></p><select id="moneyType"><option>Gasto</option><option>Ingreso</option></select>${field('Concepto','concept','text','')}${field('Importe (€)','amount','number','','min="0" step="0.01"')}<button class="primary" onclick="addMoney()">Guardar movimiento</button>${a.map(x=>`<div class="line"><span>${esc(x.title)}<br><small>${x.date}</small></span>${x.type==='Gasto'?'−':'+'}${x.amount.toFixed(2)} €</div>`).join('')}`)}${card('Datos y privacidad',`<p>Los datos permanecen en este navegador. Exporta copias regularmente.</p><div class="actions"><button onclick="backup()">Exportar copia</button><button onclick="$('restore').click()">Importar copia</button></div><input id="restore" type="file" accept="application/json" style="display:none" onchange="restoreFile(this)">`)}`}
function addTask(){let t=val('task').trim();if(t){S.tasks.push({title:t,due:val('due'),doneDate:null});save();render()}}function addMoney(){let t=val('concept').trim(),a=num('amount');if(t&&a>0&&Number.isFinite(a)){S.money.push({title:t,amount:a,type:val('moneyType'),date:day()});save();render()}}

function makeRoutine(d,s){let minutes=d.short?Math.min(s.minutes||60,25):s.minutes;let football=hasFootball(s.type),match=s.type==='partido',next=schedule()[(weekDay()+1)%7].type;let tired=recovery(),limited=football||hasFootball(next)||next==='partido';if(d.pain||match||minutes<10||(!['gym','ambos','futbol'].includes(s.type)&&d.sessionChoice!=='gym'))return [];let count=minutes>=75?8:minutes>=60?7:minutes>=45?6:minutes>=30?5:minutes>=20?3:2;if(tired)count=Math.min(count,4);if(football)count=Math.min(count,3);let v=volume(),v14=volume(14),score=g=>v[g]*2+v14[g];let chosen=[],add=x=>{if(x&&!chosen.includes(x)&&chosen.length<count)chosen.push(x)};let allowed=pool.filter(x=>!football||x[1]!=='Peso muerto rumano'&&x[1]!=='Sentadilla con mancuerna'&&x[0]!=='Piernas'&&x[1]!=='Press militar');if(!football){add(pool[0]);add(pool[1]);add(pool[2]);if(!limited&&!tired)add(pool[3]);}let rank=groups.slice().sort((a,b)=>score(a)-score(b));for(let g of rank){if(football&&g==='Piernas')continue;if(limited&&chosen.some(x=>x[0]==='Piernas')&&g==='Piernas')continue;if(!chosen.some(x=>x[0]===g))add(allowed.find(x=>x[0]===g));}for(let x of allowed){if(limited&&x[0]==='Piernas'&&chosen.some(y=>y[0]==='Piernas'))continue;add(x)}return chosen.map(([group,name,reps])=>{let last=S.sets.filter(x=>x.name.toLowerCase()===name.toLowerCase()).at(-1);return {group,name,reps,sets:tired||football||limited&&group==='Piernas'?2:3,kg:last?.kg??null,rest:group==='Core'?60: ['Press banca','Remo','Sentadilla con mancuerna','Peso muerto rumano','Jalón al pecho'].includes(name)?120:75}})}
propose=()=>{let d=today(),s={...slot()};if(d.sessionChoice==='gym'&&!s.minutes)s.minutes=60;S.plan=makeRoutine(d,s);S.routineDay=day();S.routineAccepted=false;save();render()};

let lastTab3=-1;render=function(){let names=['Inicio','Entreno','Salud','Mi vida','Coach'];$('nav').innerHTML=names.map((n,i)=>`<button class="${tab===i?'active':''}" ${tab===i?'aria-current="page"':''} onclick="go(${i})"><b>${icon3(i)}</b>${n}</button>`).join('');$('app').innerHTML=[home,training,health,life,coach][tab]();if(lastTab3!==tab){$('app').classList.remove('section-enter');void $('app').offsetWidth;$('app').classList.add('section-enter');window.scrollTo(0,0);lastTab3=tab}save();drawTimer()};
const homeBefore3=home;home=()=>{let d=today(),p=points(),m=missions(d),n=m.filter(x=>x[1]).length,ratio=n/m.length;let greeting=new Date().getHours()<12?'Buenos días.':new Date().getHours()<20?'Buenas tardes.':'Buenas noches.';let html=homeBefore3().replace(/<h2>Tu día.*?<\/h2>/,`<div class="eyebrow">Tu panel personal · 3.0</div><h2>${greeting}</h2>`);html=html.replace(/<section class="card"><h3>NIVEL .*?<\/section>/,`<section class="card hero"><div><div class="eyebrow">Rendimiento de hoy</div><div class="big">${Math.round(ratio*100)}%</div><small>${n} de ${m.length} misiones · Nivel ${Math.floor(p/200)+1}</small><div class="bar"><i style="width:${p%200/2}%"></i></div><small>${p} XP · Racha ${streak()} días</small></div><svg viewBox="0 0 120 120" aria-label="${Math.round(ratio*100)} por ciento de misiones"><circle cx="60" cy="60" r="47" fill="none" stroke="var(--border)" stroke-width="10"/><circle cx="60" cy="60" r="47" fill="none" stroke="var(--green)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${295.3*ratio} 295.3" transform="rotate(-90 60 60)"/><circle cx="60" cy="60" r="32" fill="none" stroke="var(--border)" stroke-width="7"/><circle cx="60" cy="60" r="32" fill="none" stroke="var(--violet)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${201*p% (201*200)/200} 201" transform="rotate(-90 60 60)"/><path d="M60 38 44 65h15l-4 17 23-30H63l5-14z" fill="var(--green)"/></svg></section>`);return html.replace('Planning de hoy','Tu próxima actividad').replace('Misiones realistas','Misiones de hoy').replace('Hoy voy justo de tiempo','Hoy tengo poco tiempo')};

let timerEnd3=0,timerRemaining3=90,timerRunning3=false;function drawTimer(){let e=$('timerDisplay');if(!e)return;let n=timerRunning3?Math.max(0,Math.ceil((timerEnd3-Date.now())/1000)):timerRemaining3;e.textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');if(timerRunning3&&n===0){timerRunning3=false;timerRemaining3=0;toast3('Descanso terminado');navigator.vibrate?.(150)}let b=$('timerToggle');if(b)b.textContent=timerRunning3?'Pausar':'Iniciar'}function preset3(n){timerRunning3=false;timerRemaining3=n;drawTimer()}function toggleTimer3(){if(timerRunning3){timerRemaining3=Math.max(0,Math.ceil((timerEnd3-Date.now())/1000));timerRunning3=false}else{if(!timerRemaining3)timerRemaining3=90;timerEnd3=Date.now()+timerRemaining3*1000;timerRunning3=true}drawTimer()}setInterval(drawTimer,250);
