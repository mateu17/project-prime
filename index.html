nt-size:12px;letter-spacing:1px} .actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}.done{text-decoration:line-through;color:var(--muted)}svg{width:100%;height:auto} .notice{border-left:3px solid var(--green);padding-left:12px} .empty{color:var(--muted);padding:8px 0}

</style></head><body><main><header><h1>prime<span style="color:var(--green)">.</span></h1><div class="header-actions"><button onclick="cycleTheme()" id="themeButton" aria-label="Cambiar tema" title="Cambiar tema">◐</button><button onclick="backup()" aria-label="Exportar datos" title="Exportar datos">↧</button></div></header><div id="app"></div></main><nav id="nav"></nav><script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const day=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}; const initial=()=>({days:{},sets:[],tasks:[],money:[],goal:90,profile:{work:'07:00–16:00',sport:'20:30–22:30',steps:7000,sleep:8},habits:[],targets:[],short:false,plan:[],routineDay:'',routineAccepted:false});let S;try{S=JSON.parse(localStorage.getItem('prime-v1'))||initial()}catch{S=initial()}let tab=0;const groups=['Pecho','Espalda','Piernas','Hombros','Bíceps','Tríceps','Core'];const exercises={'Pecho':['Press banca','Press mancuernas'],'Espalda':['Remo','Jalón al pecho'],'Piernas':['Sentadilla con mancuerna','Extensión de cuádriceps','Peso muerto rumano'],'Hombros':['Press militar','Elevaciones laterales'],'Bíceps':['Curl mancuernas'],'Tríceps':['Extensión tríceps'],'Core':['Plancha','Dead bug']};function today(){return S.days[day()]??=( {weight:'',sleep:'',steps:'',water:0,creatine:false,meals:[],energy:3,workout:false,review:false,short:false})}function save(){try{localStorage.setItem('prime-v1',JSON.stringify(S))}catch(e){alert('No se han podido guardar los datos. Exporta una copia.')}}function go(n){tab=n;render()}function change(k,v){today()[k]=v;save();render()}function val(id){return $(id).value}function num(id){return Number(val(id))}function recent(n){let x=new Date();x.setDate(x.getDate()-n+1);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`}function volume(n=7){let o=Object.fromEntries(groups.map(g=>[g,0]));S.sets.filter(x=>x.date>=recent(n)).forEach(x=>o[x.group]=(o[x.group]||0)+x.sets);return o}function sport(){return [1,3,4].includes(new Date().getDay())}function gym(){return [2,5].includes(new Date().getDay())}function missions(d){return [['Registrar peso',!!d.weight],['Registrar descanso',!!d.sleep],['Registrar una comida',d.meals.length>0],['Tomar creatina (si corresponde)',d.creatine],['Completar una tarea personal',S.tasks.some(t=>t.doneDate===day()&&!/(comida|menú|menu|cena|desayuno|almuerzo|gasto|economía)/i.test(t.title))],[(sport()||gym())?'Registrar entrenamiento':'Registrar recuperación',d.workout||d.review]]}function points(){return Object.entries(S.days).reduce((a,[date,d])=>a+10*[!!d.weight,!!d.sleep,d.meals.length>0,d.creatine,S.tasks.some(t=>t.doneDate===date&&!/(comida|menú|menu|cena|desayuno|almuerzo|gasto|economía)/i.test(t.title)),d.workout||d.review].filter(Boolean).length,0)}function planText(){return sport()?'Fútbol sala · 20:30–22:30':gym()?'Gimnasio · sesión de fuerza':'Recuperación o descanso activo'}function card(t,b){return `<section class="card"><h3>${t}</h3>${b}</section>`}function field(label,id,type,value,extra=''){return `<label>${label}<input id="${id}" type="${type}" value="${esc(value)}" ${extra}></label>`}function chart(){let a=Object.entries(S.days).filter(([k,d])=>Number(d.weight)>0).sort().slice(-30);if(!a.length)return '<p class="empty">Registra tu primer peso para ver la evolución.</p>';let w=a.map(x=>+x[1].weight),min=Math.min(...w)-1,max=Math.max(...w)+1;let pts=w.map((v,i)=>`${20+i*280/Math.max(1,w.length-1)},${100-(v-min)/(max-min)*80}`).join(' ');return `<svg viewBox="0 0 320 120" role="img" aria-label="Evolución de peso"><polyline points="${pts}" stroke="var(--green)" stroke-width="3" fill="none"/>${w.map((v,i)=>`<circle cx="${20+i*280/Math.max(1,w.length-1)}" cy="${100-(v-min)/(max-min)*80}" r="3" fill="var(--green)"/>`).join('')}<text x="20" y="115" fill="var(--muted)" font-size="10">${a[0][0]}</text><text x="300" y="115" text-anchor="end" fill="var(--muted)" font-size="10">${a.at(-1)[0]}</text></svg><small>Último: ${w.at(-1)} kg · Cambio registrado: ${(w.at(-1)-w[0]).toFixed(1)} kg</small>`}function home(){let d=today(),m=missions(d),n=m.filter(x=>x[1]).length,p=points();return `<h2>Tu día</h2><div class="muted">${new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})}</div>${card('NIVEL '+(Math.floor(p/200)+1),`<div class="big">${p} XP</div><div class="bar"><i style="width:${p%200/2}%"></i></div><small>${200-p%200} XP para el siguiente nivel</small>`)}<div class="grid">${[['Peso',d.weight?d.weight+' kg':'—'],['Sueño',d.sleep?d.sleep+' h':'—'],['Pasos',d.steps||'—'],['Misiones',n+'/'+m.length]].map(([k,v])=>`<div class="card"><small>${k}</small><div class="big">${v}</div></div>`).join('')}</div>${card('Planning de hoy',`<p>${planText()}</p><button class="secondary" onclick="change('short',!today().short)">${d.short?'Restaurar día normal':'Hoy voy justo de tiempo'}</button>${d.short?'<p class="notice">Prioriza registrar tus datos, una tarea esencial y descansar o realizar una sesión breve si procede.</p>':''}`)}${card('Misiones realistas',m.map(([t,b])=>`<div class="line"><span class="${b?'done':''}">${t}</span><strong>${b?'✓':'○'}</strong></div>`).join('')+`<div class="bar"><i style="width:${n/m.length*100}%"></i></div><div class="actions"><button onclick="go(2)">Registrar salud</button><button onclick="go(3)">Mis tareas</button></div>`)}${card('Evolución física',chart())}`}
function propose(){let d=today(),v=volume(7),v14=volume(14),rank=[...groups].sort((a,b)=>(v[a]*2+v14[a])-(v[b]*2+v14[b]));let tired=(d.sleep!==''&&+d.sleep<6)||+d.energy<=2;let allowed=rank.filter(g=>!(sport()&&g==='Piernas'));let count=tired||d.short?2:3;S.plan=allowed.slice(0,count).map(g=>({group:g,name:exercises[g][0],sets:tired?2:3,reps:g==='Core'?30:10}));S.routineDay=day();S.routineAccepted=false;save();render()}function logSet(){let g=val('group'),name=val('exercise').trim(),sets=num('sets'),reps=num('reps'),kg=num('kg');if(!name||!Number.isInteger(sets)||sets<1||!Number.isInteger(reps)||reps<1||kg<0||!Number.isFinite(kg))return alert('Revisa los datos del ejercicio.');S.sets.push({date:day(),group:g,name,sets,reps,kg});today().workout=true;save();render()}function usePlan(i){let x=S.plan[i];$('group').value=x.group;$('exercise').value=x.name;$('sets').value=x.sets;$('reps').value=x.reps;$('kg').value=0;let last=S.sets.filter(y=>y.name===x.name).at(-1);if(last)$('kg').value=last.kg;$('exercise').scrollIntoView({block:'center'})}function training(){let v=volume(),d=today();return `<h2>Entrenamiento</h2>${card('Hoy · '+planText(),`<p class="muted">Equilibrio muscular, carga y recuperación. Las propuestas no sustituyen una planificación profesional.</p><div class="actions"><button class="primary" onclick="propose()">Generar rutina adaptada</button><button onclick="change('workout',true)">Registrar fútbol / sesión</button></div>${S.routineDay===day()?`<p class="notice">Prioridad a los músculos con menos series registradas en 7 y 14 días. ${sport()?'Se evita añadir pierna antes del fútbol sala.':''} ${(d.sleep!==''&&+d.sleep<6)||+d.energy<=2?'Volumen reducido por recuperación.':''}</p>${!S.plan.length?'<p>Hoy se recomienda recuperación, sin rutina adicional.</p>':''}${S.plan.map((x,i)=>`<div class="line"><span>${x.name}<br><small>${x.group} · ${x.sets} × ${x.reps}${x.name==='Plancha'?' s':''}</small></span>${S.routineAccepted?`<button onclick="usePlan(${i})">Registrar</button>`:''}</div>`).join('')}<button class="primary" ${!S.plan.length?'disabled':''} onclick="S.routineAccepted=true;save();render()">${S.routineAccepted?'Rutina aceptada ✓':'Aceptar propuesta'}</button>`:''}`)}${card('Equilibrio muscular · 7 días',groups.map(g=>`<div class="line"><span>${g}<div class="bar"><i style="width:${Math.min(100,v[g]/10*100)}%"></i></div></span><small>${v[g]} series</small></div>`).join('')+'<small>La barra usa 10 series como referencia visual, no como obligación.</small>')}${card('Registrar ejercicio',`<label>Grupo muscular<select id="group" onchange="$('exercise').value=exercises[this.value][0]">${groups.map(g=>`<option>${g}</option>`).join('')}</select></label>${field('Ejercicio','exercise','text','Press banca')}<div class="grid">${field('Series','sets','number',3,'min="1"')}${field('Repeticiones / segundos (plancha)','reps','number',10,'min="1"')}${field('Carga (kg)','kg','number',0,'min="0" step="0.25"')}</div><button class="primary" onclick="logSet()">Guardar ejercicio</button><button onclick="suggestLoad()">Consultar última carga</button><p id="loadTip" class="muted"></p>`)}${card('Historial',S.sets.slice().reverse().slice(0,30).map(x=>`<div class="line"><span>${esc(x.name)}<br><small>${x.date} · ${x.sets} × ${x.reps} · ${x.kg} kg</small></span></div>`).join('')||'<p class="empty">Todavía no hay ejercicios registrados.</p>')}`}
function suggestLoad(){let name=val('exercise').trim(),a=S.sets.filter(x=>x.name.toLowerCase()===name.toLowerCase()),l=a.at(-1);$('loadTip').textContent=l?`Última sesión: ${l.kg} kg, ${l.sets} × ${l.reps}. Mantén la carga o aumenta el mínimo disponible solo si completaste las repeticiones con técnica y margen de 2–3 repeticiones.`:'No hay registros anteriores. Empieza con una carga cómoda y buena técnica.'}
function health(){let d=today();return `<h2>Salud y nutrición</h2>${card('Registro diario',`${field('Peso (kg)','weight','number',d.weight,'min="1" step="0.1"')}${field('Sueño (horas)','sleep','number',d.sleep,'min="0" max="24" step="0.25"')}${field('Pasos','steps','number',d.steps,'min="0"')}<label>Energía (1 = muy baja, 5 = alta)<select id="energy">${[1,2,3,4,5].map(n=>`<option ${d.energy==n?'selected':''}>${n}</option>`).join('')}</select></label><button class="primary" onclick="saveHealth()">Guardar datos</button>`)}${card('Hábitos',`<div class="line"><span>Agua · ${d.water} vasos</span><button onclick="change('water',Math.max(0,today().water-1))">−</button><button onclick="change('water',today().water+1)">+</button></div><div class="line"><span>Creatina</span><input type="checkbox" ${d.creatine?'checked':''} onchange="change('creatine',this.checked)"></div><div class="line"><span>Descanso / recuperación</span><input type="checkbox" ${d.review?'checked':''} onchange="change('review',this.checked)"></div>`)}${card('Alimentación sin báscula',`<label>¿Qué has comido?<textarea id="meal" placeholder="Ej. arroz con pollo, un plato mediano"></textarea></label><button class="primary" onclick="addMeal()">Registrar comida</button>${d.meals.map((m,i)=>`<div class="line"><span>${esc(m)}</span><button onclick="today().meals.splice(${i},1);save();render()">×</button></div>`).join('')}`)}${card('Ideas de menú',`<p>Comida: lentejas, arroz con pollo o pasta con atún.</p><p>Cena: filete con patata cocida, fajitas de pollo o tortilla con jamón.</p><small>Ajusta cantidades a hambre, actividad y recuperación.</small>`)}${card('Peso y objetivo',chart()+field('Objetivo personal (kg)','goal','number',S.goal,'min="1" step="0.1"')+'<button onclick="if(num(\'goal\')>0){S.goal=num(\'goal\');save();render()}">Guardar objetivo</button>')}`}

// 4.6 — Replanning based on recorded sets, never on attendance flags.
const logged46=(date,name)=>S.sets.filter(x=>x.date===date&&x.name===name).reduce((a,x)=>a+Number(x.sets||0),0);
const skipped46=date=>!!week()?.skipped46?.[date];
function status46(date,p){let total=p.reduce((a,x)=>a+x.sets,0),done=p.reduce((a,x)=>a+Math.min(x.sets,logged46(date,x.name)),0);return {total,done,text:skipped46(date)?(done?'Interrumpida':'No realizada'):total&&done>=total?'Completada':date<day()&&total?(done?'Parcial':'No realizada'):done?'En curso':total?'Pendiente':'Sin fuerza prevista'};}
const baseMake46=makeWeek4;
function redistribute46(from=weekDay()){
 let w=week();if(!w)return;from=Math.max(from,weekDay());let old=JSON.parse(JSON.stringify(w.routines||{}));
 baseMake46(from);let r=w.routines;for(let i=from;i<7;i++){let date=weekDate4(i);if(skipped46(date)){r[date]=old[date]||[];continue;}let p=r[date]||[];for(let x of old[date]||[]){if(logged46(date,x.name)>0){let j=p.findIndex(y=>y.name===x.name);if(j>=0)p[j]=x;else p.push(x)}}}
 const future=()=>Object.entries(r).filter(([d])=>d>=day()&&!skipped46(d)).flatMap(([d,p])=>p.map(x=>({...x,sets:Math.max(0,x.sets-logged46(d,x.name))})));
 const cost=()=>{let v=volume45([...actual4(),...future()]);return zones4.reduce((a,g)=>a+Math.pow(Math.max(0,goal45(g)-v[g].total)/goal45(g),2),0)};
 let changes=[];for(let pass=0;pass<30;pass++){let baseline=cost(),best=null;for(let i=from;i<7;i++){let d=w.days[i],date=weekDate4(i),p=r[date]||[],f=d.type==='gym',near=w.days[i+1]?.type==='partido';if(skipped46(date)||!['gym','ambos','futbol'].includes(d.type)||d.minutes<15)continue;
 let cap=d.minutes-(f?8:4),max=f?8:3;const consider=(q,label)=>{if(duration41(q)>cap||q.length>max)return;r[date]=q;let gain=baseline-cost();r[date]=p;if(gain>0.00001&&(!best||gain>best.gain))best={date,q,gain,label}};
 for(let j=0;j<p.length;j++){let x=p[j];if(logged46(date,x.name))continue;if(x.sets<(f?4:3))consider(p.map((y,k)=>k===j?{...y,sets:y.sets+1}:y),`${weekdays[i]}: +1 serie de ${x.name}`)}
 for(let e of catalog4){if((!f&&e[3]!=='small')||((!f||near)&&lower4.includes(e[0]))||p.some(x=>x.name===e[1]))continue;let x=item41([e[1],2,e[2],lower4.includes(e[0])||/press|remo|jalón/i.test(e[1])?120:75]);if(p.length<max)consider([...p,x],`${weekdays[i]}: añadir ${x.name}`);for(let j=0;j<p.length;j++){if(logged46(date,p[j].name))continue;consider(p.map((y,k)=>k===j?x:y),`${weekdays[i]}: ${p[j].name} → ${x.name}`)}}
 }if(!best)break;r[best.date]=best.q;changes.push(best.label)}
 w.program46=true;let v=volume45([...actual4(),...future()]);let diff=[];for(let i=from;i<7;i++){let date=weekDate4(i);if(skipped46(date))continue;let a=old[date]||[],b=r[date]||[];for(let x of b){let before=a.find(y=>y.name===x.name);if(!before||before.sets!==x.sets)diff.push(`${weekdays[i]}: ${x.name} · ${before?before.sets+' → ':''}${x.sets} series`)}for(let x of a)if(!b.some(y=>y.name===x.name))diff.push(`${weekdays[i]}: retirar ${x.name}`)}w.report46={date:day(),changes:diff,missing:zones4.filter(g=>v[g].total<goal45(g)).map(g=>`${g}: ${Math.round((goal45(g)-v[g].total)*10)/10} series equivalentes`)};save();
}

const blocks47={lateral:{name:'Impulso lateral y recepción',dose:'2 × 3 por lado · 75–90 s',cue:'Salto lateral corto, aterriza estable. Aumenta distancia solo con control; detente si cae la calidad.',min:6},vertical:{name:'Salto vertical con contramovimiento',dose:'3 × 3 · 75–90 s',cue:'Máxima intención, aterrizaje suave. Sin carga añadida. No convertir en circuito de fatiga.',min:6},hip:{name:'Copenhagen de palanca corta',dose:'2 × 15 s por lado · 45 s',cue:'Rodilla apoyada en banco estable. Empieza suave; sin dolor inguinal.',min:4},control:{name:'Movilidad activa de cadera y tobillo',dose:'2 × 5 por lado',cue:'Rotaciones 90/90 y movilidad de tobillo sin forzar aperturas.',min:4}};
S.keeper47??={enabled:true,logs:{},tests:[],team:{}};
function planKeeper47(from=weekDay()) {let w=week();if(!w)return;w.keeper47??={};let full=0,mini=0;for(let i=0;i<7;i++){let d=w.days[i],date=weekDate4(i),f=d.type==='gym',active=['gym','ambos','futbol'].includes(d.type)&&d.minutes>=20,near=w.days[i+1]?.type==='partido'||w.days[i-1]?.type==='partido';let key=active?(f?(full++%2?'vertical':'lateral'):(mini++%3===2?'hip':null)):null;if(i<from)continue;if(skipped46(date)){continue}if(S.keeper47.logs[date]?.done){w.keeper47[date]=S.keeper47.logs[date].key;continue;}if(!S.keeper47.enabled||!active||near||f&&d.minutes<55)key=null;if(key==='hip'&&d.minutes<20)key=null;w.keeper47[date]=key;}}

function keeperBlock47(){let k=week()?.keeper47?.[day()],b=blocks47[k];if(!b||skipped46(day()))return '';return card('Bloque físico de portero · antes de la fuerza',`<div class="eyebrow">${b.min} min incluidos en la sesión</div><h3>${b.name}</h3><p>${b.dose}</p><p>${b.cue}</p><button class="primary" onclick="keeperDone47()">${S.keeper47.logs[day()]?.done?'✓ Realizado · desmarcar':'Registrar bloque realizado'}</button><small>Separado del volumen de hipertrofia. Calienta antes de saltar. No realizar con dolor o fatiga extrema.</small>`)}

const render47=render;render=()=>{render47();document.querySelectorAll('.eyebrow').forEach(e=>e.textContent=e.textContent.replace(/4\.[2-7]/g,'4.7.1').replace('PERFORMANCE LAB','ROAD TO ELITE'))};
if(week()&&!week().keeper47)redistribute46();
