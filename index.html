<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101412"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="PRIME"><meta name="apple-mobile-web-app-status-bar-style" content="black"><link rel="apple-touch-icon" href="icon-180.png"><title>PROJECT PRIME</title><link rel="manifest" href="manifest.json"><style>
:root{color-scheme:dark;--bg:#101412;--panel:#1b221e;--green:#b5f54b;--muted:#a0ada4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f2f5f2;font:15px system-ui,sans-serif}main{max-width:680px;margin:auto;padding:22px 16px 110px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:23px;letter-spacing:2px;margin:0}h2{font-size:24px;margin:22px 0 12px}h3{font-size:16px;margin:0 0 12px}p{line-height:1.5}small,.muted{color:var(--muted)}.card{background:var(--panel);border:1px solid #303b32;border-radius:18px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid .card{margin:0}.big{font-size:27px;font-weight:750;color:var(--green)}button,input,select,textarea{font:inherit;border-radius:10px;border:1px solid #414d43;padding:11px;background:#131a15;color:#fff;max-width:100%}button{cursor:pointer}button.primary{background:var(--green);color:#14200a;font-weight:750;border:none}button.secondary{background:#273229}button.danger{color:#ff9a9a}input,select,textarea{width:100%;margin:5px 0 9px}input[type=checkbox]{width:22px;height:22px;accent-color:var(--green);margin:0}label{display:block;color:var(--muted);font-size:13px}.line{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:11px 0;border-bottom:1px solid #313b33}.line:last-child{border:0}.line span{flex:1;overflow-wrap:anywhere}.bar{height:8px;background:#344038;border-radius:10px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--green);border-radius:10px}nav{position:fixed;bottom:0;left:0;right:0;background:#141a16;border-top:1px solid #344038;display:flex;justify-content:center;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:2}nav button{border:0;background:none;color:var(--muted);font-size:11px;flex:1;max-width:135px;padding:8px 2px}nav button b{display:block;font-size:22px;margin-bottom:3px}nav button.active{color:var(--green)}.tag{color:var(--green);font-size:12px;letter-spacing:1px} .actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}.done{text-decoration:line-through;color:var(--muted)}svg{width:100%;height:auto} .notice{border-left:3px solid var(--green);padding-left:12px} .empty{color:var(--muted);padding:8px 0} </style></head><body><main><header><h1>PROJECT <span style="color:var(--green)">PRIME</span></h1><button onclick="backup()" title="Exportar datos">↧</button></header><div id="app"></div></main><nav id="nav"></nav><script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const day=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}; const initial=()=>({days:{},sets:[],tasks:[],money:[],goal:90,short:false,plan:[],routineDay:'',routineAccepted:false});let S;try{S=JSON.parse(localStorage.getItem('prime-v1'))||initial()}catch{S=initial()}let tab=0;const groups=['Pecho','Espalda','Piernas','Hombros','Bíceps','Tríceps','Core'];const exercises={'Pecho':['Press banca','Press mancuernas'],'Espalda':['Remo','Jalón al pecho'],'Piernas':['Sentadilla con mancuerna','Extensión de cuádriceps','Peso muerto rumano'],'Hombros':['Press militar','Elevaciones laterales'],'Bíceps':['Curl mancuernas'],'Tríceps':['Extensión tríceps'],'Core':['Plancha','Dead bug']};function today(){return S.days[day()]??=( {weight:'',sleep:'',steps:'',water:0,creatine:false,meals:[],energy:3,workout:false,review:false,short:false})}function save(){try{localStorage.setItem('prime-v1',JSON.stringify(S))}catch(e){alert('No se han podido guardar los datos. Exporta una copia.')}}function go(n){tab=n;render()}function change(k,v){today()[k]=v;save();render()}function val(id){return $(id).value}function num(id){return Number(val(id))}function recent(n){let x=new Date();x.setDate(x.getDate()-n+1);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`}function volume(n=7){let o=Object.fromEntries(groups.map(g=>[g,0]));S.sets.filter(x=>x.date>=recent(n)).forEach(x=>o[x.group]=(o[x.group]||0)+x.sets);return o}function sport(){return [1,3,4].includes(new Date().getDay())}function gym(){return [2,5].includes(new Date().getDay())}function missions(d){return [['Registrar peso',!!d.weight],['Registrar descanso',!!d.sleep],['Registrar una comida',d.meals.length>0],['Tomar creatina (si corresponde)',d.creatine],['Completar una tarea personal',S.tasks.some(t=>t.doneDate===day())],[(sport()||gym())?'Registrar entrenamiento':'Registrar recuperación',d.workout||d.review]]}function points(){return Object.entries(S.days).reduce((a,[date,d])=>a+10*[!!d.weight,!!d.sleep,d.meals.length>0,d.creatine,S.tasks.some(t=>t.doneDate===date),d.workout||d.review].filter(Boolean).length,0)}function planText(){return sport()?'Fútbol sala · 20:30–22:30':gym()?'Gimnasio · sesión de fuerza':'Recuperación o descanso activo'}function card(t,b){return `<section class="card"><h3>${t}</h3>${b}</section>`}function field(label,id,type,value,extra=''){return `<label>${label}<input id="${id}" type="${type}" value="${esc(value)}" ${extra}></label>`}function chart(){let a=Object.entries(S.days).filter(([k,d])=>Number(d.weight)>0).sort().slice(-30);if(!a.length)return '<p class="empty">Registra tu primer peso para ver la evolución.</p>';let w=a.map(x=>+x[1].weight),min=Math.min(...w)-1,max=Math.max(...w)+1;let pts=w.map((v,i)=>`${20+i*280/Math.max(1,w.length-1)},${100-(v-min)/(max-min)*80}`).join(' ');return `<svg viewBox="0 0 320 120" role="img" aria-label="Evolución de peso"><polyline points="${pts}" stroke="#b5f54b" stroke-width="3" fill="none"/>${w.map((v,i)=>`<circle cx="${20+i*280/Math.max(1,w.length-1)}" cy="${100-(v-min)/(max-min)*80}" r="3" fill="#b5f54b"/>`).join('')}<text x="20" y="115" fill="#a0ada4" font-size="10">${a[0][0]}</text><text x="300" y="115" text-anchor="end" fill="#a0ada4" font-size="10">${a.at(-1)[0]}</text></svg><small>Último: ${w.at(-1)} kg · Cambio registrado: ${(w.at(-1)-w[0]).toFixed(1)} kg</small>`}function home(){let d=today(),m=missions(d),n=m.filter(x=>x[1]).length,p=points();return `<h2>Tu día</h2><div class="muted">${new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})}</div>${card('NIVEL '+(Math.floor(p/200)+1),`<div class="big">${p} XP</div><div class="bar"><i style="width:${p%200/2}%"></i></div><small>${200-p%200} XP para el siguiente nivel</small>`)}<div class="grid">${[['Peso',d.weight?d.weight+' kg':'—'],['Sueño',d.sleep?d.sleep+' h':'—'],['Pasos',d.steps||'—'],['Misiones',n+'/'+m.length]].map(([k,v])=>`<div class="card"><small>${k}</small><div class="big">${v}</div></div>`).join('')}</div>${card('Planning de hoy',`<p>${planText()}</p><button class="secondary" onclick="change('short',!today().short)">${d.short?'Restaurar día normal':'Hoy voy justo de tiempo'}</button>${d.short?'<p class="notice">Prioriza registrar tus datos, una tarea esencial y descansar o realizar una sesión breve si procede.</p>':''}`)}${card('Misiones realistas',m.map(([t,b])=>`<div class="line"><span class="${b?'done':''}">${t}</span><strong>${b?'✓':'○'}</strong></div>`).join('')+`<div class="bar"><i style="width:${n/m.length*100}%"></i></div><div class="actions"><button onclick="go(2)">Registrar salud</button><button onclick="go(3)">Mis tareas</button></div>`)}${card('Evolución física',chart())}`}
function propose(){let d=today(),v=volume(7),v14=volume(14),rank=[...groups].sort((a,b)=>(v[a]*2+v14[a])-(v[b]*2+v14[b]));let tired=(d.sleep!==''&&+d.sleep<6)||+d.energy<=2;let allowed=rank.filter(g=>!(sport()&&g==='Piernas'));let count=tired||d.short?2:3;S.plan=allowed.slice(0,count).map(g=>({group:g,name:exercises[g][0],sets:tired?2:3,reps:g==='Core'?30:10}));S.routineDay=day();S.routineAccepted=false;save();render()}function logSet(){let g=val('group'),name=val('exercise').trim(),sets=num('sets'),reps=num('reps'),kg=num('kg');if(!name||!Number.isInteger(sets)||sets<1||!Number.isInteger(reps)||reps<1||kg<0||!Number.isFinite(kg))return alert('Revisa los datos del ejercicio.');S.sets.push({date:day(),group:g,name,sets,reps,kg});today().workout=true;save();render()}function usePlan(i){let x=S.plan[i];$('group').value=x.group;$('exercise').value=x.name;$('sets').value=x.sets;$('reps').value=x.reps;$('kg').value=0;let last=S.sets.filter(y=>y.name===x.name).at(-1);if(last)$('kg').value=last.kg;$('exercise').scrollIntoView({block:'center'})}function training(){let v=volume(),d=today();return `<h2>Entrenamiento</h2>${card('Hoy · '+planText(),`<p class="muted">Equilibrio muscular, carga y recuperación. Las propuestas no sustituyen una planificación profesional.</p><div class="actions"><button class="primary" onclick="propose()">Generar rutina adaptada</button><button onclick="change('workout',true)">Registrar fútbol / sesión</button></div>${S.routineDay===day()?`<p class="notice">Prioridad a los músculos con menos series registradas en 7 y 14 días. ${sport()?'Se evita añadir pierna antes del fútbol sala.':''} ${(d.sleep!==''&&+d.sleep<6)||+d.energy<=2?'Volumen reducido por recuperación.':''}</p>${S.plan.map((x,i)=>`<div class="line"><span>${x.name}<br><small>${x.group} · ${x.sets} × ${x.reps}${x.group==='Core'?' s':''}</small></span>${S.routineAccepted?`<button onclick="usePlan(${i})">Registrar</button>`:''}</div>`).join('')}<button class="primary" onclick="S.routineAccepted=true;save();render()">${S.routineAccepted?'Rutina aceptada ✓':'Aceptar propuesta'}</button>`:''}`)}${card('Equilibrio muscular · 7 días',groups.map(g=>`<div class="line"><span>${g}<div class="bar"><i style="width:${Math.min(100,v[g]/10*100)}%"></i></div></span><small>${v[g]} series</small></div>`).join('')+'<small>La barra usa 10 series como referencia visual, no como obligación.</small>')}${card('Registrar ejercicio',`<label>Grupo muscular<select id="group" onchange="$('exercise').value=exercises[this.value][0]">${groups.map(g=>`<option>${g}</option>`).join('')}</select></label>${field('Ejercicio','exercise','text','Press banca')}<div class="grid">${field('Series','sets','number',3,'min="1"')}${field('Repeticiones / segundos (plancha)','reps','number',10,'min="1"')}${field('Carga (kg)','kg','number',0,'min="0" step="0.25"')}</div><button class="primary" onclick="logSet()">Guardar ejercicio</button><button onclick="suggestLoad()">Consultar última carga</button><p id="loadTip" class="muted"></p>`)}${card('Historial',S.sets.slice().reverse().slice(0,30).map(x=>`<div class="line"><span>${esc(x.name)}<br><small>${x.date} · ${x.sets} × ${x.reps} · ${x.kg} kg</small></span></div>`).join('')||'<p class="empty">Todavía no hay ejercicios registrados.</p>')}`}
function suggestLoad(){let name=val('exercise').trim(),a=S.sets.filter(x=>x.name.toLowerCase()===name.toLowerCase()),l=a.at(-1);$('loadTip').textContent=l?`Última sesión: ${l.kg} kg, ${l.sets} × ${l.reps}. Mantén la carga o aumenta el mínimo disponible solo si completaste las repeticiones con técnica y margen de 2–3 repeticiones.`:'No hay registros anteriores. Empieza con una carga cómoda y buena técnica.'}
function health(){let d=today();return `<h2>Salud y nutrición</h2>${card('Registro diario',`${field('Peso (kg)','weight','number',d.weight,'min="1" step="0.1"')}${field('Sueño (horas)','sleep','number',d.sleep,'min="0" max="24" step="0.25"')}${field('Pasos','steps','number',d.steps,'min="0"')}<label>Energía (1 = muy baja, 5 = alta)<select id="energy">${[1,2,3,4,5].map(n=>`<option ${d.energy==n?'selected':''}>${n}</option>`).join('')}</select></label><button class="primary" onclick="saveHealth()">Guardar datos</button>`)}${card('Hábitos',`<div class="line"><span>Agua · ${d.water} vasos</span><button onclick="change('water',Math.max(0,today().water-1))">−</button><button onclick="change('water',today().water+1)">+</button></div><div class="line"><span>Creatina</span><input type="checkbox" ${d.creatine?'checked':''} onchange="change('creatine',this.checked)"></div><div class="line"><span>Descanso / recuperación</span><input type="checkbox" ${d.review?'checked':''} onchange="change('review',this.checked)"></div>`)}${card('Alimentación sin báscula',`<label>¿Qué has comido?<textarea id="meal" placeholder="Ej. arroz con pollo, un plato mediano"></textarea></label><button class="primary" onclick="addMeal()">Registrar comida</button>${d.meals.map((m,i)=>`<div class="line"><span>${esc(m)}</span><button onclick="today().meals.splice(${i},1);save();render()">×</button></div>`).join('')}`)}${card('Ideas de menú',`<p>Comida: lentejas, arroz con pollo o pasta con atún.</p><p>Cena: filete con patata cocida, fajitas de pollo o tortilla con jamón.</p><small>Ajusta cantidades a hambre, actividad y recuperación.</small>`)}${card('Peso y objetivo',chart()+field('Objetivo personal (kg)','goal','number',S.goal,'min="1" step="0.1"')+'<button onclick="if(num(\'goal\')>0){S.goal=num(\'goal\');save();render()}">Guardar objetivo</button>')}`}
function saveHealth(){let w=val('weight'),sl=val('sleep'),st=val('steps');if((w&&+w<=0)||(sl&&(+sl<0||+sl>24))||(st&&+st<0))return alert('Revisa los valores.');Object.assign(today(),{weight:w,sleep:sl,steps:st,energy:num('energy')});save();render()}function addMeal(){let m=val('meal').trim();if(m){today().meals.push(m);save();render()}}
function life(){let month=day().slice(0,7),a=S.money.filter(x=>x.date.startsWith(month)),inc=a.filter(x=>x.type==='Ingreso').reduce((s,x)=>s+x.amount,0),out=a.filter(x=>x.type==='Gasto').reduce((s,x)=>s+x.amount,0);return `<h2>Mi vida</h2>${card('Tareas y objetivos',`<input id="task" placeholder="Ej. Preparar bolsa del gimnasio"><label>Fecha<input id="due" type="date" value="${day()}"></label><button class="primary" onclick="addTask()">Añadir tarea</button>${S.tasks.map((t,i)=>`<div class="line"><input type="checkbox" ${t.doneDate?'checked':''} onchange="S.tasks[${i}].doneDate=this.checked?day():null;save();render()"><span class="${t.doneDate?'done':''}">${esc(t.title)}<br><small>${esc(t.due)}</small></span><button onclick="S.tasks.splice(${i},1);save();render()">×</button></div>`).join('')}`)}${card('Economía básica · este mes',`<div class="grid"><div><small>Ingresos</small><div class="big">${inc.toFixed(2)} €</div></div><div><small>Gastos</small><div class="big">${out.toFixed(2)} €</div></div></div><p>Balance registrado: <strong>${(inc-out).toFixed(2)} €</strong></p><select id="moneyType"><option>Gasto</option><option>Ingreso</option></select>${field('Concepto','concept','text','')}${field('Importe (€)','amount','number','','min="0" step="0.01"')}<button class="primary" onclick="addMoney()">Guardar movimiento</button>${a.map(x=>`<div class="line"><span>${esc(x.title)}<br><small>${x.date}</small></span>${x.type==='Gasto'?'−':'+'}${x.amount.toFixed(2)} €</div>`).join('')}`)}${card('Datos y privacidad',`<p>Los datos permanecen en este navegador. Exporta copias regularmente.</p><div class="actions"><button onclick="backup()">Exportar copia</button><button onclick="$('restore').click()">Importar copia</button></div><input id="restore" type="file" accept="application/json" style="display:none" onchange="restoreFile(this)">`)}`}
function addTask(){let t=val('task').trim();if(t){S.tasks.push({title:t,due:val('due'),doneDate:null});save();render()}}function addMoney(){let t=val('concept').trim(),a=num('amount');if(t&&a>0&&Number.isFinite(a)){S.money.push({title:t,amount:a,type:val('moneyType'),date:day()});save();render()}}
function coach(){let d=today(),v=volume(),low=groups.filter(g=>v[g]===0),days=Object.entries(S.days).filter(([k])=>k>=recent(7)),sl=days.filter(([k,x])=>x.sleep!=='').map(([k,x])=>+x.sleep),avg=sl.length?sl.reduce((a,b)=>a+b,0)/sl.length:null,trained=days.filter(([k,x])=>x.workout).length,ms=missions(d),n=ms.filter(x=>x[1]).length;let msg=!days.some(([k,x])=>x.weight||x.sleep||x.workout||x.meals.length)?'Empezamos desde cero. Registra tus datos para que pueda adaptar las recomendaciones.':(d.sleep!==''&&+d.sleep<6)||d.energy<=2?'Hoy conviene bajar el ritmo. Prioriza la recuperación y no intentes compensar todo en una sesión.':n>=4?'Buen trabajo con la constancia de hoy. Mantén el ritmo sin aumentar todas las cargas de golpe.':'Todavía tienes margen para completar una o dos acciones sencillas. Prioriza lo importante.';return `<h2>Tu entrenador</h2><p class="tag">PRIME COACH · MOTOR LOCAL</p>${card('Mensaje de hoy',`<p class="notice">${msg}</p>`)}${card('Prioridades',`<p>${low.length?'Sin series registradas en los últimos 7 días: '+low.join(', ')+'. Introduce trabajo progresivo según recuperación.':'Todos los grupos tienen trabajo registrado esta semana. Mantén un reparto equilibrado.'}</p><p>${avg!==null&&avg<7?'El sueño medio registrado es bajo. Intenta reservar más tiempo para dormir.':'Registra el sueño con regularidad para ajustar la carga.'}</p><button class="primary" onclick="go(1);propose()">Ver propuesta de entrenamiento</button>`)}${card('Informe · últimos 7 días',`<div class="grid"><div><small>Días con sesión</small><div class="big">${trained}</div></div><div><small>Sueño medio</small><div class="big">${avg===null?'—':avg.toFixed(1)+' h'}</div></div><div><small>Series registradas</small><div class="big">${Object.values(v).reduce((a,b)=>a+b,0)}</div></div><div><small>Días con peso</small><div class="big">${days.filter(([k,x])=>x.weight).length}/7</div></div></div><p>Objetivo próximo: registrar con constancia y dar prioridad a los grupos menos trabajados, sin forzar la recuperación.</p>${chart()}`)}<small>Entrenador basado en reglas locales; no es una IA generativa ni asesoramiento médico.</small>`}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='prime-'+day()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function restoreFile(el){try{let x=JSON.parse(await el.files[0].text());if(!x.days||!Array.isArray(x.sets)||!Array.isArray(x.tasks)||!Array.isArray(x.money))throw Error();if(confirm('¿Sustituir los datos actuales por esta copia?')){S={...initial(),...x};save();render()}}catch{alert('Copia no válida.')}}function render(){let names=['Inicio','Entreno','Salud','Mi vida','Entrenador'],icons=['⌂','▥','♡','☷','✦'];$('nav').innerHTML=names.map((n,i)=>`<button class="${tab===i?'active':''}" onclick="go(${i})"><b>${icons[i]}</b>${n}</button>`).join('');$('app').innerHTML=[home,training,health,life,coach][tab]();save()}render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
